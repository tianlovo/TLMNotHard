name: Repository documentation

on:
  push:
    paths:
      - 'README.md'
      - 'README.en.md'
      - '.markdownlint*'
      - '.github/workflows/readme.yml'
      - 'scripts/check_repository_paths.py'
  pull_request:
    paths:
      - 'README.md'
      - 'README.en.md'
      - '.markdownlint*'
      - '.github/workflows/readme.yml'
      - 'scripts/check_repository_paths.py'
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npx --yes markdownlint-cli2@0.24.0
      - run: python3 scripts/check_repository_paths.py
