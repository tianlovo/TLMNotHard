// Use this init alone: it applies the unchanged, separately approved original reference build
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

def originalProbePath = System.getenv('TLMNH_REFERENCE_PROBE')
def swimProbePath = System.getenv('TLMNH_SWIM_PROBE')
def referenceHomePath = System.getenv('TLMNH_REFERENCE_HOME')
if (!originalProbePath || !swimProbePath || !referenceHomePath)
    throw new GradleException('TLMNH_REFERENCE_PROBE, TLMNH_SWIM_PROBE and external TLMNH_REFERENCE_HOME are required')
def originalProbe = new File(originalProbePath).canonicalFile
def tool = new File(swimProbePath).canonicalFile
def home = new File(referenceHomePath).canonicalFile
def port = new File(originalProbe, '../..').canonicalFile
if (!new File(tool, 'contract.json').isFile() || home.toPath().startsWith(port.toPath()))
    throw new GradleException('Swim contract and external reference runtime required')
apply from: new File(originalProbe, 'reference.init.gradle')

def specFile = new File(tool, 'identity-classes.json')
def spec = new JsonSlurper().parse(specFile)
if (spec.schema != 'swim-reference-identity-classes-v1' || spec.classes.toSet().size() != spec.classes.size()
    || !spec.classes.containsAll(spec.compiledClasses)) throw new GradleException('Invalid swim identity class set')
def selected = spec.classes.sort()
def agentRoot = new File(originalProbe, '../geometry-reference/agent').canonicalFile
def identityFile = new File(home, 'identity/swim-build.json')
def sha = { byte[] bytes -> MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }

gradle.projectsEvaluated {
    def upstream = gradle.rootProject
    if (upstream.tasks.findByName('tlmnhReferenceRuntimeIdentity') == null)
        throw new GradleException('Approved original reference identity task absent')
    upstream.sourceSets.main.java.srcDir(new File(tool, 'reference'))
    upstream.tasks.named('processResources').configure {
        from(new File(tool, 'contract.json')) { into 'tlmnh-swim' }
        from(specFile) { into 'tlmnh-swim' }
    }
    def sources = upstream.sourceSets.create('swimDefinitionAgent') { java.srcDir(agentRoot) }
    upstream.tasks.named(sources.compileJavaTaskName).configure { options.release.set(17) }
    def agent = upstream.tasks.register('swimDefinitionAgentJar', Jar) {
        dependsOn sources.classesTaskName
        from sources.output
        archiveFileName.set('swim-definition-agent.jar')
        destinationDirectory.set(upstream.layout.buildDirectory.dir('swim-reference'))
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        manifest.attributes('Premain-Class': 'com.tianluoqaq.tlmnh.geometry.identity.GeometryDefinitionAgent',
            'Can-Redefine-Classes': 'false', 'Can-Retransform-Classes': 'false')
    }
    def identity = upstream.tasks.register('prepareSwimReferenceIdentity') {
        dependsOn upstream.tasks.named('tlmnhReferenceRuntimeIdentity'), agent
        doLast {
            def configured = System.getenv('TLMNH_REFERENCE_BUILD_IDENTITY')
            def baseFile = configured ? new File(configured) : new File(home, 'identity/build-identity.json')
            def base = new JsonSlurper().parse(baseFile)
            if (base.schema != 'reference-build-identity-v1' || base.status != 'LOCK_VERIFIED'
                || base.upstreamCommit != '8a3ac5e9eacf0c6d63adf8832949f3ce81484fe6')
                throw new GradleException('Verified fixed original reference build required')
            def compiled = spec.compiledClasses.collectEntries { name ->
                def files = upstream.sourceSets.main.output.classesDirs.files.collect {
                    new File(it, name.replace('.', '/') + '.class')
                }.findAll { it.isFile() }
                if (files.size() != 1) throw new GradleException('Missing/duplicate swim class: ' + name)
                [(name): sha(files[0].bytes)]
            }
            def inputs = upstream.fileTree(tool).matching {
                include '**/*.java', '**/*.gradle', '*.json', '*.py'
                exclude '**/__pycache__/**'
            }.files.collect { file -> [file: tool.toPath().relativize(file.toPath()).toString().replace('\\', '/'), sha256: sha(file.bytes)] }.sort { it.file }
            def reusedAgentInputs = upstream.fileTree(agentRoot).matching { include '**/*.java' }.files.collect { file ->
                [file: agentRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/'), sha256: sha(file.bytes)]
            }.sort { it.file }
            def resourceOwners = [:].withDefault { [] }
            def artifactHashes = [:]
            upstream.configurations.compileClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { jar ->
                def zip = new java.util.zip.ZipFile(jar)
                try {
                    selected.findAll { !spec.compiledClasses.contains(it) }.each { name ->
                        def entry = zip.getEntry(name.replace('.', '/') + '.class')
                        if (entry != null) {
                            def bytes = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                            if (!artifactHashes.containsKey(jar)) artifactHashes[jar] = sha(jar.bytes)
                            resourceOwners[name].add([artifactFileName: jar.name, artifactSha256: artifactHashes[jar], resourceSha256: sha(bytes)])
                        }
                    }
                } finally { zip.close() }
            }
            def resources = selected.collectEntries { name ->
                if (compiled.containsKey(name)) return [(name): [resourceSha256: compiled[name], kind: 'compiled-upstream-or-probe']]
                if (resourceOwners[name].size() != 1) throw new GradleException('Missing/ambiguous actual compile classpath resource: ' + name)
                [(name): resourceOwners[name][0] + [kind: 'resolved-compile-classpath-jar']]
            }
            def value = [schema: 'swim-reference-build-v1', status: 'BASE_LOCK_VERIFIED',
                upstreamCommit: base.upstreamCommit, minecraft: '1.20.1', forge: '47.2.0', javaFeature: 17,
                baseReferenceBuildIdentitySha256: sha(baseFile.bytes), baseReferenceBuildIdentity: base,
                contractSha256: sha(new File(tool, 'contract.json').bytes), identityClassesSha256: sha(specFile.bytes),
                expectedResources: resources, compiledClasses: compiled,
                definitionAgentSha256: sha(agent.get().archiveFile.get().asFile.bytes),
                definitionAgentClass: 'com.tianluoqaq.tlmnh.geometry.identity.GeometryDefinitionAgent',
                toolInputs: inputs, reusedAgentInputs: reusedAgentInputs,
                scope: 'selected original swimming manager/Swim/Behavior definitions; controlled fluid/pose/navigation/RNG; not entire classpath or natural Brain']
            identityFile.parentFile.mkdirs()
            identityFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8')
        }
    }
    upstream.minecraft.runs.client {
        property 'tlmnh.referenceProbe', 'false'
        property 'tlmnh.geometryProbe', 'false'
        property 'tlmnh.followProbe', 'false'
        property 'tlmnh.moveProbe', 'false'
        property 'tlmnh.followNaturalProbe', 'false'
        property 'tlmnh.swimProbe', 'true'
    }
    upstream.tasks.matching { it.name == 'runClient' }.configureEach {
        dependsOn identity
        doFirst {
            jvmArgs '-Dtlmnh.swim.buildIdentity=' + identityFile.absolutePath,
                '-Dtlmnh.geometry.buildIdentity=' + identityFile.absolutePath,
                '-javaagent:' + agent.get().archiveFile.get().asFile.absolutePath + '=' + selected.join(',')
        }
    }
}
